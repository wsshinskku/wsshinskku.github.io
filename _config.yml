title: "Wooseok Shin"
description: "Ph.D. Candidate @ SKKU | AI-enabled 5G Open RAN, Federated Learning"
url: "https://wsshinskku.github.io"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: default
locale: "ko-KR"

plugins:
  - jekyll-include-cache

# === Collections (글이 쌓이는 구조) ===
collections:
  research:
    output: true
    permalink: /research/:title/
  projects:
    output: true
    permalink: /projects/:title/
  teaching:
    output: true
    permalink: /teaching/:title/

# === Sidebar Navigation ===
defaults:
  - scope:
      path: ""
      type: pages
    values:
      sidebar:
        nav: "main"
  - scope:
      path: ""
      type: research
    values:
      layout: single
      sidebar:
        nav: "main"
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      sidebar:
        nav: "main"
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      sidebar:
        nav: "main"

author:
  name: "Wooseok Shin"
  avatar: "/assets/img/profile.jpg"
  bio: "AI-enabled 5G Open RAN, Federated Learning"
  location: "Seoul / Suwon, KR"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=xm6czH8AAAAJ&hl=ko"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wsshinskku"
